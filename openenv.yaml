        # Evaluate the agent's triage decision from the step response
        obs = observation.get("echoed_message", "") if isinstance(observation, dict) else str(observation)
        # Parse out the reality from "Diagnosis: X. Reality: Y"
        correct = ""
        if "Reality:" in obs:
            correct = obs.split("Reality:")[-1].strip().rstrip(".")
